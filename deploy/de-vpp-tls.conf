# Cổng TLS cho việc thử đăng nhập bằng PMH ID THẬT trên máy dev.
#
# PMH ID chỉ đẩy người dùng về đúng `redirect_uri` đã đăng ký —
# `https://de-vpp.pmh.com.vn:8443/api/auth/callback` — nên máy này phải phục vụ
# đúng tên miền đó, đúng cổng đó, và phải là https. Thêm một dòng hosts trỏ
# `de-vpp.pmh.com.vn` về 127.0.0.1 là đủ (xem README mục "Ghép vào PMH ID thật").
#
# Chứng chỉ ở đây là TỰ KÝ, chỉ dùng để thử trên máy: trình duyệt sẽ cảnh báo và
# phải bấm qua. Lên chạy thật thì dùng cert do EDGE / CA cấp.
server {
    listen 8443 ssl;
    http2 on;
    server_name de-vpp.pmh.com.vn;

    ssl_certificate     /etc/nginx/tls/de-vpp.crt;
    ssl_certificate_key /etc/nginx/tls/de-vpp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # PHẢI là https: api dựa vào đây để biết mình đang sau TLS mà đặt cookie
        # phiên `secure`. Khai nhầm http là trình duyệt bỏ cookie và không ai đăng
        # nhập được, dù mọi thứ khác đúng.
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
