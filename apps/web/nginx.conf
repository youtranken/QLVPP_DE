# nginx phục vụ SPA đã build và proxy /api sang api.
# Nhờ vậy trình duyệt chỉ thấy MỘT origin: cookie phiên là same-origin và
# redirect OIDC quay về đúng chỗ — giống hệt cấu hình prod (SDD §4).
server {
    listen 80;
    server_name _;

    # Nén cho các tệp tĩnh; bundle của Ant Design + ECharts khá lớn.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Tệp có hash trong tên ⇒ cache lâu; index.html thì không được cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tải file Excel và ảnh có thể lâu hơn request thường.
        proxy_read_timeout 120s;
        # Ảnh đính kèm tối đa 5MB; chừa dư cho phần bao của multipart.
        client_max_body_size 8m;
    }

    # SPA dùng client-side routing: mọi đường dẫn không phải tệp đều trả index.html,
    # nếu không thì tải lại trang /quan-tri/don sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
