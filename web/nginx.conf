# EDGE giữ TLS và gửi X-Forwarded-Proto=https; gọi thẳng vpp-web thì fallback $scheme.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name de-vpp.pmh.com.vn;

  add_header X-Frame-Options        'DENY' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy        'strict-origin-when-cross-origin' always;
  add_header Permissions-Policy     'geolocation=(), camera=(), microphone=()' always;

  # Re-resolve DNS Docker: api recreate đổi IP không làm nginx 502 vĩnh viễn
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api không slash vẫn về backend, không rơi vào SPA fallback
  location = /api {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;   # proxy_pass dùng biến không tự giữ path
    include /etc/nginx/proxy-api-headers.conf;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    # Ảnh món ≤ 5MB + overhead multipart; khớp EDGE
    client_max_body_size 6m;
  }
}
