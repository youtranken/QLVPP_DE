# EDGE giữ TLS và gửi X-Forwarded-Proto=https; gọi thẳng vpp-web thì fallback $scheme.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name de-qlvpp.pmh.com.vn;

  include /etc/nginx/security-headers.conf;

  # Re-resolve DNS Docker: api recreate đổi IP không làm nginx 502 vĩnh viễn
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # index.html luôn hỏi lại server (ETag/304): deploy mới thì trình duyệt nhận ngay tên chunk mới,
  # không giữ index cũ trỏ tới /static/<hash cũ> đã bị xóa (trang trắng)
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Chunk Vite có hash trong tên → cache 1 năm, không bao giờ đổi nội dung.
  # Thiếu file → 404 thật, không rơi về index.html (text/html làm module script lỗi MIME).
  location ^~ /static/ {
    include /etc/nginx/security-headers.conf;
    # Không "always": 404 không được mang max-age (trình duyệt nhớ lỗi cả năm)
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Tệp tĩnh không hash ở gốc (login-bg.webp, logo…): cache 1 ngày rồi hỏi lại; thiếu → 404
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|avif|woff2?|ttf|css|js|mjs|map|json|txt|xml|webmanifest)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Route SPA (không có đuôi tệp) → index.html (khớp location = /index.html ở trên, mang no-cache)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api không slash vẫn về backend, không rơi vào SPA fallback
  location = /api {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;   # proxy_pass dùng biến không tự giữ path
    include /etc/nginx/proxy-api-headers.conf;
  }

  # ^~: không để location regex tệp tĩnh ở trên bắt /api/…png
  location ^~ /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    # Ảnh món ≤ 5MB + overhead multipart; khớp EDGE
    client_max_body_size 6m;
  }
}
