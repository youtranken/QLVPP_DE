<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sidebar Hành chính</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.sb-link{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:12px;color:#C9DEE4;text-decoration:none;font:500 14px 'Be Vietnam Pro',sans-serif}
.sb-link:hover{background:rgba(255,255,255,.08);color:#FFFFFF}
.sb-link:focus-visible{outline:2px solid #9FE3F0;outline-offset:2px}
</style>
</helmet>
<nav aria-label="Khu vực Hành chính" style="width: 100%; min-height: 100%; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; font-family: 'Be Vietnam Pro', sans-serif; color: #D6E9EE; background: rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.10)">
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
    <div style="width: 38px; height: 38px; border-radius: 12px; background: #E7F6F9; color: #0E2A33; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">VPP</div>
    <div style="line-height: 1.25"><div style="font-weight: 700; font-size: 15px; color: #FFFFFF">VPP D&amp;E</div><div style="font-size: 12px; color: #9DBDC6">Khu vực Hành chính</div></div>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; font-weight: 600; color: #8FB3BD; padding: 0 12px 6px">{{g.label}}</div>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
        <a class="sb-link" href="{{it.href}}" style="{{it.style}}" aria-current="{{it.current}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
          <span style="flex: 1">{{it.label}}</span>
          <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}">
            <span style="{{it.badgeStyle}}">{{it.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="margin-top: auto; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10)">
    <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600; color: #FFFFFF">Kỳ tháng 11</span><span style="color: #C9DEE4">32/40 đã đăng ký</span></div>
    <div style="height: 6px; border-radius: 999px; background: rgba(255,255,255,0.14); margin-top: 10px; overflow: hidden"><div style="width: 80%; height: 100%; border-radius: 999px; background: #9FE3F0"></div></div>
    <div style="font-size: 12px; color: #9DBDC6; margin-top: 8px">Khóa lúc 00:00 ngày 11/11</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["main","giao","hangve","guiadm","danhmuc","kho","ngoai","nhom","nhanvien","nhatky","cauhinh"],"default":"main"},"$preview":{"width":272,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'main';
    const P = {
      home: 'M3 11l9-8 9 8M5 10v10h14V10',
      hand: 'M7 11V6a2 2 0 0 1 4 0v5m0-1V4a2 2 0 0 1 4 0v7m0-2a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3-2l2 2',
      box: 'M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8',
      send: 'M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z',
      grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      shelf: 'M4 3v18M20 3v18M4 9h16M4 15h16',
      ask: 'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V15M12 19h.01',
      tag: 'M20 12l-8 8-9-9V3h8l9 9zM7.5 7.5h.01',
      users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
      log: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6zM14 3v6h6M8 13h8M8 17h5',
      cog: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'
    };
    const G = [
      { label: 'Hằng tháng', items: [
        ['main', 'Tháng này', 'Main.dc.html', P.home, ''],
        ['giao', 'Giao hàng', 'Giao.dc.html', P.hand, '28'],
        ['hangve', 'Hàng về', 'HangVe.dc.html', P.box, ''],
        ['guiadm', 'Gửi ADM', 'GuiADM.dc.html', P.send, '']
      ] },
      { label: 'Danh mục và tủ', items: [
        ['danhmuc', 'Danh mục món', 'DanhMuc.dc.html', P.grid, ''],
        ['kho', 'Tủ / Kho', 'Kho.dc.html', P.shelf, '!4'],
        ['ngoai', 'Món ngoài danh mục', 'Main.dc.html', P.ask, '!1'],
        ['nhom', 'Nhóm và đơn vị tính', '#', P.tag, '']
      ] },
      { label: 'Quản lý', items: [
        ['nhanvien', 'Nhân viên', '#', P.users, ''],
        ['nhatky', 'Nhật ký', '#', P.log, ''],
        ['cauhinh', 'Cấu hình', '#', P.cog, '']
      ] }
    ];
    const badgeBase = 'min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;';
    const groups = G.map((g) => ({
      label: g.label,
      items: g.items.map(([id, label, href, d, b]) => {
        const on = id === active;
        const warn = b.startsWith('!');
        return {
          label, href, d,
          current: on ? 'page' : 'false',
          style: on ? 'background:rgba(159,227,240,.16);color:#FFFFFF;font-weight:600;box-shadow:inset 0 0 0 1px rgba(159,227,240,.28)' : '',
          hasBadge: !!b, badge: warn ? b.slice(1) : b,
          badgeStyle: badgeBase + (warn ? 'background:#F7B267;color:#3A1A00' : 'background:rgba(255,255,255,.16);color:#FFFFFF')
        };
      })
    }));
    return { groups };
  }
}
</script>
</body>
</html>
